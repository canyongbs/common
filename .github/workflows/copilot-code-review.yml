name: Copilot Code Review Setup

# Runs before Copilot code review to prepare its ephemeral environment. This is a
# package (not an app), so it only installs PHP and Composer, then runs Composer's
# post-autoload-dump hook so the generated AGENTS.md and .github/skills (common's
# own guidelines plus the Boost guidelines/skills an app would receive) are
# available to the reviewer.
on: # zizmor: ignore[concurrency-limits]
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-code-review.yml
    pull_request:
        paths:
            - .github/workflows/copilot-code-review.yml

permissions: {}

jobs:
    # The job MUST be named `copilot-setup-steps` or Copilot will not pick it up.
    copilot-setup-steps:
        name: Copilot Code Review Setup
        runs-on: ubuntu-22.04

        permissions:
            contents: read

        timeout-minutes: 15

        # NOTE: Copilot code review lifts these steps into its own runner and does NOT carry a
        # job-level `env:` block, so the PHP config is inlined below rather than referenced via
        # `${{ env.* }}`. Using job-level env here causes empty inputs (e.g. "Input required and
        # not supplied: extensions"), which aborts setup and forces a limited default review.
        steps:
            - name: Setup cache environment
              id: extcache
              uses: shivammathur/cache-extensions@50000e7030dd3fa176964a8fbbbd9e4b560fe4d4 # 1.15.0
              with:
                  php-version: '8.5'
                  extensions: gd, gmp, redis, mailparse
                  key: ext-cache-copilot-v1

            - name: Cache extensions
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.extcache.outputs.dir }}
                  key: ${{ runner.os }}-phpext-8.5-ext-cache-copilot-v1
                  restore-keys: ${{ runner.os }}-phpext-8.5

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  coverage: none
                  extensions: gd, gmp, redis, mailparse

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cache dependencies
              id: cache-composer
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

            - if: ${{ steps.cache-composer.outputs.cache-hit != 'true' }}
              name: Install Dependencies
              run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader
              shell: bash

            # Fires the post-autoload-dump hook (common:compile-guidance) which
            # generates AGENTS.md and .github/skills used by the code reviewer.
            # Dev dependencies (Testbench, Boost) are required, so this runs
            # without --no-dev.
            - name: Publish agent guidance
              run: composer dump-autoload
